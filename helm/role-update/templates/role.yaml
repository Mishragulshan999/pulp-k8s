apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulp
  namespace: pulp
  labels:
    app.kubernetes.io/name: pulp-role
    app.kubernetes.io/part-of: pulp
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: role-update
    meta.helm.sh/release-namespace: pulp
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - delete

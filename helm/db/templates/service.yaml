apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.service.labels | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.service.selector | nindent 4 }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
  type: {{ .Values.service.type }}
